apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketchat
  namespace: default
  labels:
    app: rocketchat
    component: chat
spec:
  replicas: 2  # Testing with 2 pods
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rocketchat
      component: chat
  template:
    metadata:
      labels:
        app: rocketchat
        component: chat
    spec:
      # Pod anti-affinity for high availability (soft requirement for single-node)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - rocketchat
              topologyKey: kubernetes.io/hostname

      # Security context
      securityContext:
        runAsUser: 999
        fsGroup: 999
        runAsNonRoot: true

      # Service account
      serviceAccountName: rocketchat-sa

      containers:
      - name: rocketchat
        image: rocketchat/rocket.chat:7.9.3
        imagePullPolicy: IfNotPresent

        # Ports
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: rocketchat-config

        # Additional environment variables
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: OVERWRITE_SETTING_Prometheus_Enabled
          value: "false"  # Disable metrics for testing

        # Resource limits (from your values.yaml)
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL

        # Volume mounts (for read-only root filesystem workaround)
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: uploads-tmp
          mountPath: /app/uploads/tmp

      # Volumes
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: uploads-tmp
        emptyDir: {}
