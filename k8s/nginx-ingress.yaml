apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rocketchat-ingress
  namespace: default
  annotations:
    # Hash-based load balancing (from your values.yaml)
    nginx.ingress.kubernetes.io/upstream-hash-by: "$$request_uri$$host"
    # Allow large file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Disable proxy buffering for WebSocket
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # WebSocket upgrade headers and proxy headers
    nginx.ingress.kubernetes.io/proxy-set-headers: |
      X-Forwarded-Host $host
      X-Forwarded-Port $server_port
      X-Forwarded-Proto $scheme
      X-Real-IP $remote_addr
      X-Forwarded-For $proxy_add_x_forwarded_for
      X-Nginx-Proxy true
      Upgrade $http_upgrade
      Connection upgrade
spec:
  ingressClassName: nginx
  rules:
  - http:  # Default routing without host specification
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rocketchat-service
            port:
              number: 80
