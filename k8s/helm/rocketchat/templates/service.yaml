apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocketchat.fullname" . }}
  labels:
    {{- include "rocketchat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "rocketchat.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: 3000
    protocol: TCP
