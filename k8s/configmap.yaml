apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-config
  namespace: default
data:
  # MongoDB connection - using internal MongoDB service
  MONGO_URL: "mongodb://rocketchat:rocketchat123@rocketchat-mongodb:27017/rocketchat?replicaSet=rs0"
  MONGO_OPLOG_URL: "mongodb://rocketchat:rocketchat123@rocketchat-mongodb:27017/local?replicaSet=rs0"
  ROOT_URL: "http://52.183.221.89"

  # Rocket.Chat configuration
  DEPLOY_METHOD: "docker"
  DEPLOY_PLATFORM: "kubernetes"
  INSTANCE_IP: ""

  # Disable microservices for monolithic deployment
  MICROSERVICES_ENABLED: "false"

  # Disable federation
  FEDERATION_ENABLED: "false"

  # Admin user (optional - will be created on first login)
  ADMIN_USERNAME: "admin"
  ADMIN_PASS: "changeme123"
  ADMIN_EMAIL: "admin@example.com"

  # SMTP settings (optional)
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASS: ""

  # Other settings
  API_Enable_CORS: "true"
  API_Enable_Rate_Limiter: "false"
