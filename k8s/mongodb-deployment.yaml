apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketchat-mongodb
  namespace: default
  labels:
    app: mongodb
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      component: database
  template:
    metadata:
      labels:
        app: mongodb
        component: database
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: mongodb
        image: docker.io/bitnami/mongodb:7.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGODB_ROOT_PASSWORD
          value: "rocketchat123"
        - name: MONGODB_USERNAME
          value: "rocketchat"
        - name: MONGODB_PASSWORD
          value: "rocketchat123"
        - name: MONGODB_DATABASE
          value: "rocketchat"
        - name: MONGODB_REPLICA_SET_NAME
          value: "rs0"
        ports:
        - containerPort: 27017
          name: mongodb
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: mongodb-data
          mountPath: /bitnami/mongodb
        livenessProbe:
          exec:
            command:
            - mongo
            - --eval
            - db.adminCommand('ping')
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - mongo
            - --eval
            - db.adminCommand('ping')
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: mongodb-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rocketchat-mongodb
  namespace: default
  labels:
    app: mongodb
    component: database
spec:
  selector:
    app: mongodb
    component: database
  ports:
  - name: mongodb
    port: 27017
    targetPort: 27017
  type: ClusterIP
